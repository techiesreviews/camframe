[package]
name = "camframe"
version = "0.1.0"
edition = "2024"
description = "Experimental GPUI port of the CamFrame camera overlay."
publish = false

[dependencies]
anyhow = "1.0.104"
async-channel = "2"
dirs = "7.0.0"
gpui-kit = "0.7"
image = { version = "0.25", default-features = false }
# Only the capture backends; frames are decoded here straight to GPUI's BGRA layout,
# which avoids nokhwa's C libjpeg-turbo build.
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zune-jpeg = "0.5"

[profile.dev]
# The per-frame resampler runs on every camera frame.
opt-level = 1

[profile.dev.package."*"]
# Frame decoding and GPUI are unusably slow unoptimized.
opt-level = 2

[lints.rust]
future-incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -2 }

[lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = "warn"
unwrap_used = "warn"
expect_used = "warn"
