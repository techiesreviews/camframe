[package]
name = "camframe-trial"
version = "0.1.0"
edition = "2024"
description = "Trial Rust + GPUI floating webcam bubble with live shape switching on Windows."
publish = false

[dependencies]
anyhow = "1.0"
async-channel = "2"
gpui = { package = "gpui-pre", version = "0.3.13" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.13" }
image = { version = "0.25", default-features = false }
# Capture backends only; MJPEG is decoded with pure-Rust zune-jpeg (avoids C libjpeg-turbo).
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }
raw-window-handle = "0.6"
smallvec = "1.13"
zune-jpeg = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
future-incompatible = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
