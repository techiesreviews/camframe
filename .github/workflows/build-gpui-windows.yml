name: Build GPUI experiment (Windows)

# GPUI precompiles its HLSL shaders with the Windows SDK's fxc.exe, so the port can only be
# built on Windows. This produces camframe.exe for manual testing; it never publishes a release.

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/gpui-port
    paths:
      - 'gpui/**'
      - '.github/workflows/build-gpui-windows.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build camframe.exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gpui

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui

      - name: Build release
        run: cargo build --release --locked

      - name: Upload camframe.exe
        uses: actions/upload-artifact@v7
        with:
          name: camframe-gpui-windows-x64
          path: gpui/target/release/camframe.exe
          if-no-files-found: error

      - name: Run tests
        run: cargo test --release --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
