name: Trial Rust GPUI Bubble (Windows)

# TRIAL ONLY: builds and verifies rust-trial/ on Windows and uploads a downloadable CI artifact.
# Never publishes a release, never creates a tag, never merges to main or dev.

on:
  workflow_dispatch:
  push:
    branches:
      - 'trial/rust-gpui-bubble'
    paths:
      - 'rust-trial/**'
      - '.github/workflows/trial-rust-gpui-windows.yml'

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & verify camframe-trial.exe (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-trial

      - name: Run Rust unit tests
        working-directory: rust-trial
        run: cargo test --locked

      - name: Run Clippy
        working-directory: rust-trial
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build release binary
        working-directory: rust-trial
        run: cargo build --release --locked

      - name: Download CamFrame 0.9.0 Portable for baseline comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path baseline | Out-Null
          gh release download v0.9.0 --repo "${{ github.repository }}" --pattern "CamFrame-Portable-0.9.0-Windows-x64.exe" --dir baseline
        continue-on-error: true

      - name: Verify real desktop transparency, live shape switch, and measure vs 0.9.0
        shell: pwsh
        run: |
          $baselineExe = Get-ChildItem -Path baseline -Filter "CamFrame-Portable-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          powershell -ExecutionPolicy Bypass -File rust-trial/scripts/verify-windows.ps1 `
            -ExePath "rust-trial/target/release/camframe-trial.exe" `
            -OutDir "trial-verification" `
            -CamFrame090Exe "$baselineExe"

      - name: Package trial build for Lex
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path trial-dist | Out-Null
          Copy-Item "rust-trial/target/release/camframe-trial.exe" "trial-dist/camframe-trial.exe"
          Copy-Item "rust-trial/README.md" "trial-dist/README.txt"

      - name: Upload Windows trial build artifact
        uses: actions/upload-artifact@v7
        with:
          name: camframe-rust-gpui-trial-windows-x64
          path: trial-dist/
          if-no-files-found: error

      - name: Upload desktop verification screenshots and benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: camframe-rust-gpui-trial-verification
          path: trial-verification/
          if-no-files-found: warn
