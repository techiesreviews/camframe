<!doctype html>
<html lang="en" class="scheme-only-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CamFrame overlay</title>
    <link rel="stylesheet" href="./assets/icons.css" />
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <main class="overlay" id="overlay" data-shape="circle" data-hovered="false" data-fullscreen="false" data-positioning="false">
      <nav class="hover-toolbar" id="hover-toolbar" aria-label="Camera quick actions">
        <button type="button" id="close-button" aria-label="Close CamFrame" title="Close CamFrame">
          <i class="ph ph-x-circle" aria-hidden="true"></i>
        </button>
        <button type="button" id="fullscreen-button" aria-label="Enter full screen" title="Enter full screen">
          <i class="ph ph-corners-out" aria-hidden="true"></i>
        </button>
        <button type="button" id="shape-button" aria-label="Change camera shape" title="Change camera shape">
          <i class="ph ph-circle" aria-hidden="true"></i>
        </button>
        <button type="button" id="position-button" aria-label="Frame camera" aria-pressed="false" title="Frame camera: drag to pan, scroll to zoom">
          <i class="ph ph-crosshair" aria-hidden="true"></i>
        </button>
        <button type="button" id="controls-button" aria-label="Open camera controls" title="Open camera controls">
          <i class="ph ph-sliders-horizontal" aria-hidden="true"></i>
        </button>
        <div class="framing-support" role="status" aria-live="polite">
          <strong>Zoom <span id="framing-zoom">100%</span></strong>
          <span>Drag · Scroll · Double-click resets</span>
        </div>
      </nav>

      <section class="inline-settings" id="inline-settings" aria-label="Camera settings" data-active-panel="camera" hidden>
        <div class="settings-tabs" role="group" aria-label="Settings section">
          <button type="button" data-settings-tab="camera" aria-pressed="true">Camera</button>
          <button type="button" data-settings-tab="appearance" aria-pressed="false">Style</button>
          <button type="button" data-settings-tab="presets" aria-pressed="false">Scenes</button>
        </div>
        <div class="inline-setting" data-settings-panel="camera">
          <label for="overlay-camera-select">Camera</label>
          <select id="overlay-camera-select" name="camera">
            <option value="">Finding cameras...</option>
          </select>
        </div>
        <fieldset class="inline-setting inline-resolution-setting" data-settings-panel="camera">
          <legend>Camera quality</legend>
          <div class="inline-resolution-grid">
            <label for="overlay-resolution-select">
              <span>Resolution</span>
              <select id="overlay-resolution-select" name="overlay-resolution">
                <option value="480p">480p</option>
                <option value="720p">720p</option>
                <option value="1080p">1080p</option>
                <option value="2160p">4K</option>
              </select>
            </label>
          </div>
        </fieldset>
        <div class="inline-setting preset-manager" data-settings-panel="presets">
          <label for="overlay-preset-name">Save current scene</label>
          <div class="preset-save-row">
            <input id="overlay-preset-name" name="preset-name" type="text" maxlength="40" autocomplete="off" placeholder="Scene name" />
            <button type="button" id="overlay-save-preset" disabled>Save</button>
          </div>
          <select id="overlay-preset-select" name="preset" aria-label="Load saved scene">
            <option value="">No saved scenes</option>
          </select>
          <details class="scene-manager">
            <summary>Manage scenes</summary>
            <div class="scene-order-row">
              <button type="button" id="overlay-move-preset-up" disabled>Move up</button>
              <button type="button" id="overlay-move-preset-down" disabled>Move down</button>
              <button type="button" id="overlay-delete-preset" disabled>Delete</button>
            </div>
            <div class="scene-file-row">
              <button type="button" id="overlay-import-presets">Import</button>
              <button type="button" id="overlay-export-presets">Export</button>
            </div>
            <p class="scene-message" id="overlay-scene-message" aria-live="polite"></p>
          </details>
        </div>
        <div class="inline-presentation" data-settings-panel="presets">
          <label class="inline-toggle" for="overlay-launch-toggle">
            <span>Start at login</span>
            <input id="overlay-launch-toggle" name="launch-at-login" type="checkbox" />
          </label>
          <div class="shortcut-list" aria-label="Presentation shortcuts">
            <div><span>Show or hide</span><kbd>Ctrl/Cmd Shift H</kbd></div>
            <div><span>Full screen</span><kbd>Ctrl/Cmd Shift F</kbd></div>
            <div><span>Next scene</span><kbd>Ctrl/Cmd Shift P</kbd></div>
            <div><span>Scene 1–6</span><kbd>Ctrl/Cmd Shift 1–6</kbd></div>
          </div>
        </div>
        <div class="inline-setting" data-settings-panel="appearance">
          <label for="overlay-effect-select">Frame effect</label>
          <select id="overlay-effect-select" name="frame-effect">
            <option value="none">None</option>
            <option value="glow">Glow</option>
            <option value="blur">Progressive blur</option>
          </select>
        </div>
        <div class="inline-effect-color" id="overlay-effect-color-field" data-settings-panel="appearance" hidden>
          <label for="overlay-effect-color">Effect color</label>
          <div class="inline-effect-color-controls">
            <input id="overlay-effect-color" name="effect-color" type="text" value="#fb923c" maxlength="7" autocomplete="off" spellcheck="false" />
            <div class="effect-color-swatches" role="group" aria-label="Effect color presets">
              <button type="button" data-effect-color="#fb923c" aria-label="Orange"></button>
              <button type="button" data-effect-color="#22d3ee" aria-label="Cyan"></button>
              <button type="button" data-effect-color="#8b5cf6" aria-label="Violet"></button>
              <button type="button" data-effect-color="#ec4899" aria-label="Pink"></button>
              <button type="button" data-effect-color="#22c55e" aria-label="Green"></button>
              <button type="button" data-effect-color="#ffffff" aria-label="White"></button>
            </div>
          </div>
        </div>
        <div class="inline-effect-tuning" id="overlay-glow-controls" data-settings-panel="appearance" hidden>
          <div class="inline-setting inline-range">
            <div><label for="overlay-glow-strength">Glow strength</label><output id="overlay-glow-strength-output">90%</output></div>
            <input id="overlay-glow-strength" name="glow-strength" type="range" min="10" max="100" step="1" value="90" />
          </div>
          <div class="inline-setting inline-range">
            <div><label for="overlay-glow-spread">Glow spread</label><output id="overlay-glow-spread-output">13 px</output></div>
            <input id="overlay-glow-spread" name="glow-spread" type="range" min="4" max="18" step="1" value="13" />
          </div>
        </div>
        <div class="inline-effect-tuning" id="overlay-blur-controls" data-settings-panel="appearance" hidden>
          <div class="inline-setting inline-range">
            <div><label for="overlay-blur-amount">Blur</label><output id="overlay-blur-amount-output">12 px</output></div>
            <input id="overlay-blur-amount" name="blur-amount" type="range" min="4" max="18" step="1" value="12" />
          </div>
          <div class="inline-setting inline-range">
            <div><label for="overlay-blur-opacity">Opacity</label><output id="overlay-blur-opacity-output">72%</output></div>
            <input id="overlay-blur-opacity" name="blur-opacity" type="range" min="10" max="100" step="1" value="72" />
          </div>
        </div>
        <div class="inline-setting inline-range" data-settings-panel="appearance">
          <div><label for="overlay-frame-range">Frame</label><output id="overlay-frame-output">0 px</output></div>
          <input id="overlay-frame-range" name="frame" type="range" min="0" max="12" step="1" value="0" />
        </div>
        <div class="inline-toggle-list" data-settings-panel="camera">
          <label class="inline-toggle" for="overlay-mirror-toggle">
            <span>Mirror camera</span>
            <input id="overlay-mirror-toggle" name="mirror" type="checkbox" checked />
          </label>
          <label class="inline-toggle" for="overlay-top-toggle">
            <span>Always on top</span>
            <input id="overlay-top-toggle" name="always-on-top" type="checkbox" checked />
          </label>
        </div>
      </section>

      <section class="onboarding-coachmark" id="onboarding-panel" role="dialog" aria-labelledby="onboarding-title" hidden>
        <header class="onboarding-header">
          <p class="onboarding-kicker" id="onboarding-progress-label">Getting started</p>
          <button type="button" class="onboarding-skip" id="onboarding-skip">Skip</button>
        </header>
        <div class="onboarding-progress" id="onboarding-progress" role="progressbar" aria-label="Onboarding progress" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1">
          <span data-onboarding-progress="0"></span>
          <span data-onboarding-progress="1"></span>
          <span data-onboarding-progress="2"></span>
          <span data-onboarding-progress="3"></span>
        </div>
        <div class="onboarding-copy" aria-live="polite" aria-atomic="true">
          <h2 id="onboarding-title" tabindex="-1">Choose your camera</h2>
          <p id="onboarding-description"></p>
          <ul id="onboarding-items" role="list" hidden></ul>
          <p class="onboarding-note" id="onboarding-note" hidden></p>
        </div>
        <footer class="onboarding-actions">
          <button type="button" class="onboarding-back" id="onboarding-back" hidden>Back</button>
          <button type="button" class="onboarding-next" id="onboarding-next">Next</button>
        </footer>
      </section>

      <div class="onboarding-demo-mouse" id="onboarding-demo-mouse" aria-hidden="true" hidden>
        <span class="onboarding-demo-wheel" id="onboarding-demo-wheel"></span>
        <span class="onboarding-demo-click" id="onboarding-demo-click"></span>
      </div>

      <div class="presentation-toast" id="presentation-toast" role="status" aria-live="polite" hidden></div>

      <div class="camera-effect-layer" id="camera-effect-layer" aria-hidden="true">
        <div class="camera-effect-source">
          <video id="effect-camera" autoplay muted playsinline></video>
        </div>
      </div>

      <section class="camera-surface" id="camera-surface" aria-label="Movable camera overlay">
        <video id="camera" autoplay muted playsinline aria-label="Live camera preview"></video>
        <div class="camera-state" id="camera-state" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span id="camera-state-label">Starting camera.</span>
        </div>
      </section>

      <button type="button" class="selection-corner corner-top-left" data-resize-handle="top-left" aria-label="Resize from top left"></button>
      <button type="button" class="selection-corner corner-top-right" data-resize-handle="top-right" aria-label="Resize from top right"></button>
      <button type="button" class="selection-corner corner-bottom-left" data-resize-handle="bottom-left" aria-label="Resize from bottom left"></button>
      <button type="button" class="selection-corner corner-bottom-right" data-resize-handle="bottom-right" aria-label="Resize from bottom right"></button>
    </main>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
